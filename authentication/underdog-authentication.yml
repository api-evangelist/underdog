note: >-
  Underdog runs no developer programme and issues no API keys. Three auth postures exist
  on its host and should not be conflated. (1) Discovery on the agent/storefront surfaces is
  anonymous: MCP initialize and tools/list on /api/ucp/mcp and /api/mcp, Storefront GraphQL
  introspection and product/shop queries, and /products.json all answered HTTP 200 with no
  credentials on 2026-09-16. (2) UCP tools/call requires the calling agent to identify
  itself with meta.ucp-agent.profile, a reachable UCP agent profile URI (an unreachable
  profile returned -32001 "UCP discovery failed"), and get_order returned -32000
  AuthenticationRequired "A valid JWT is required", pointing at
  https://shopify.dev/docs/agents/get-started/authentication. Payment additionally requires
  contemporaneous human buyer approval (agents.md). (3) Shopper accounts use OAuth 2.0
  authorization code + PKCE against Shopify customer accounts, discovered from metadata
  served on Underdog's own hosts (issuer shopify.com/authentication/69142905142).
docs: https://underdog.shop/agents.md
