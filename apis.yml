apis:
- aid: underdog-ucp-commerce
  name: Underdog UCP Commerce MCP API
  description: 'The Universal Commerce Protocol (UCP) shopping service Underdog serves from its own domain.
    A remote MCP endpoint that answers tools/list anonymously with 13 tools covering catalog search and
    lookup, cart create/read/update/cancel, checkout create/read/update/complete/cancel, and order lookup.
    complete_checkout requires an idempotency-key and buyer approval. Merchant profile and supported
    protocol versions are published at https://underdog.shop/.well-known/ucp.'
  humanURL: https://underdog.shop/agents.md
  baseURL: https://underdog.shop/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Universal Commerce Protocol
  - Checkout
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/underdog-mcp.yml
  - type: ToolCrosswalk
    url: mcp/underdog-tool-crosswalk.yml
  - type: Documentation
    url: https://underdog.shop/agents.md
  - type: Specification
    url: https://ucp.dev/2026-04-08/specification/overview/
- aid: underdog-storefront-graphql
  name: Underdog Storefront GraphQL API
  description: 'The Shopify Storefront GraphQL API as served on underdog.shop. It answers introspection
    anonymously and exposes 424 types, 35 root query fields (products, collections, search, predictiveSearch,
    cart, blog/article, menu, metaobjects, shop, localization) and 41 mutations (cart lifecycle, customer
    accounts, Shop Pay payment request sessions) over Underdog''s own catalogue, priced in EUR for FR.'
  humanURL: https://underdog.shop/llms.txt
  baseURL: https://underdog.shop/api/2026-01/graphql.json
  tags:
  - GraphQL
  - Storefront
  - Catalog
  - Cart
  properties:
  - type: GraphQL
    url: graphql/underdog-storefront.graphql
  - type: DataModel
    url: data-model/underdog-data-model.yml
  - type: ErrorCatalog
    url: errors/underdog-problem-types.yml
- aid: underdog-storefront-mcp
  name: Underdog Storefront Policy MCP API
  description: 'A second remote MCP endpoint on underdog.shop that answers tools/list anonymously with a
    single natural-language tool, search_shop_policies_and_faqs, for questions about the store''s return,
    shipping, warranty and contact policies.'
  humanURL: https://underdog.shop/agents.md
  baseURL: https://underdog.shop/api/mcp
  tags:
  - MCP
  - Support
  - Policies
  properties:
  - type: MCPServer
    url: mcp/underdog-mcp.yml
- aid: underdog-storefront-json
  name: Underdog Storefront JSON Endpoints
  description: 'Read-only, unauthenticated JSON representations of the Underdog catalogue published by the
    Shopify storefront: /products.json, /products/{handle}.json, /collections/{handle}/products.json and
    /search?q=&type=product, plus /sitemap.xml and an agentic-discovery sitemap listing /agents.md.'
  humanURL: https://underdog.shop/llms.txt
  baseURL: https://underdog.shop
  tags:
  - JSON
  - Catalog
  - Products
  properties:
  - type: Documentation
    url: https://underdog.shop/llms.txt
