aid: underdog
name: Underdog
description: 'Underdog (legal entity Older is Better, RCS Nantes 918 609 629) is a French direct-to-consumer
  retailer of professionally refurbished large home appliances and televisions — washing machines, fridges,
  dishwashers, tumble dryers, ovens, cookers, freezers, wine cabinets, TVs and Thermomix — reconditioned in
  France and sold at up to 50% below new with a two-year warranty, delivery, installation and old-appliance
  takeback. It is a circular-economy / climate-tech company backed by Serena. Underdog has no developer
  programme and publishes no OpenAPI, but its storefront runs on Shopify and it exposes a genuine, live
  agent-commerce surface on its own domain: an /llms.txt and /agents.md agent instruction document, a
  Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, two anonymously-listable remote
  MCP endpoints (a 13-tool UCP commerce server and a 1-tool storefront policy server), an introspectable
  Shopify Storefront GraphQL API, RFC 8414 / RFC 9728 OAuth metadata, and read-only product and collection
  JSON endpoints.'
url: https://raw.githubusercontent.com/api-evangelist/underdog/refs/heads/main/apis.yml
image: https://underdog.shop/cdn/shop/files/UND-logo-Noir_1_3878927d-05f3-4209-b1e5-6113f92e6567.png?v=1762513808
