name: Underdog well-known probe
description: >-
  Probe of the RFC 8615 /.well-known/ namespace on every host the Underdog record knows:
  underdog.shop (storefront, every API baseURL), www.underdog.shop (redirect alias; its
  OAuth and UCP documents answer on www directly, the rest redirect to the apex) and
  account.underdog.shop (the customer-account authorization server named in
  authorization_servers). Real documents: the UCP merchant profile, OIDC discovery, RFC
  8414 authorization-server metadata and RFC 9728 protected-resource metadata. No
  security.txt, api-catalog, ai-plugin.json or A2A agent card is served on any host. A
  control probe of https://underdog.shop/zzz-nonsense-xyz.txt returned 404, so the host is
  not a soft-404 catch-all and the 200s are genuine documents.
