name: Underdog tool crosswalk
note: >-
  Underdog publishes no OpenAPI, so there are no REST operationIds to bind to. The two
  surfaces that coexist are the UCP/Storefront MCP servers and the Shopify Storefront
  GraphQL API, both served on underdog.shop and both introspected anonymously. Each MCP
  tool is bound here to the GraphQL root field(s) that serve the same capability, by name
  and semantics — the MCP tools are not documented as wrappers of these fields, so
  confidence is stated per row. Every GraphQL field named below was verified to exist in
  the saved SDL. The `rest` key is kept empty on every row because no REST contract exists.
